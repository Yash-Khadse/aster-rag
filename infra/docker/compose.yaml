services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    ports: ["8000:8000"]
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql+psycopg://rag:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/rag
      OLLAMA_BASE_URL: http://ollama:11434/v1
      DATA_DIR: /app/data
      QDRANT_PATH: /app/data/qdrant
    volumes: ["app-data:/app/data"]
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: rag
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      timeout: 5s
      retries: 10
  ollama:
    image: ollama/ollama:0.12.3
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ollama-data:/root/.ollama"]
volumes:
  app-data:
  postgres-data:
  ollama-data:
