[project]
name = "enterprise-rag"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20", "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1", "httpx>=0.28,<1", "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2", "langchain-core>=0.3,<2", "langchain-openai>=0.3,<2",
  "langchain-text-splitters>=0.3,<2", "pypdf>=5,<7", "python-docx>=1.1,<2",
  "beautifulsoup4>=4.12,<5", "rank-bm25>=0.2.2,<1", "qdrant-client>=1.13,<2",
  "pinecone>=6,<9", "fastembed>=0.6,<1"
]
[project.optional-dependencies]
reranking = ["sentence-transformers>=3.4,<6"]
evaluation = ["deepeval>=3,<5"]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9", "pip-audit>=2.8", "mypy>=1.15"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = [".", "apps/api"]
include = ["services*", "rag_api*"]
[tool.pytest.ini_options]
pythonpath = [".", "apps/api"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Header"]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "silent"

